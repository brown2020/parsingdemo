name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # Gate must tolerate missing Actions secrets (soft-skip Firebase/Stripe init).
  # Never inline NEXT_PUBLIC_* / API keys — ${{ secrets.* }} only.
  # Keep this job secret-free so react-doctor build-pipeline-secret-boundary stays clean;
  # deferred client init allows production build without public Firebase/Stripe keys.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
        env:
          PARSE_USE_FIXTURES: "true"
      - name: React Doctor
        run: npm run doctor
      - name: Production build
        run: npm run build
        env:
          PARSE_USE_FIXTURES: "true"
